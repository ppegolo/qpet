[project]
name = "qpet"
dynamic = ["version"]
requires-python = ">=3.12"

readme = "README.md"
license = "MIT"
description = "ML electron densities on PySCF molecules: predictions from metatomic models, potentials, multipoles, cube files and SCF guesses."
authors = [{ name = "Paolo Pegolo" }]

dependencies = [
  "pyscf>=2.14",
  "scipy",
  "torch>=2.0.0",
  "metatomic-torch>=0.1.15",
  "vesin",
]

keywords = [
  "machine learning",
  "quantum chemistry",
  "electron density",
  "electrostatics",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numba = ["numba", "threadpoolctl"]
metatrain = [
  "metatrain @ git+https://github.com/metatensor/metatrain@561e3ddc7e46b65131acf032af1ca3d830c398de",
]
gpu4pyscf = ["gpu4pyscf-cuda13x>=1.9.2"]

### ======================================================================== ###

[build-system]
requires = [
  "hatchling",
  "hatch-vcs",
]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qpet/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qpet"]

# ----------------------------
# Ruff: formatter + linter
# ----------------------------
[tool.ruff]
line-length = 88
target-version = "py312"
# hatch-vcs-generated, gitignored
extend-exclude = ["src/qpet/_version.py"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E203",  # whitespace before ':', conflicts with some formatters
]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false

# ----------------------------
# mypy configuration
# ----------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# pyscf / ase ship no type information, so any expression touching them is
# Any; these two codes are pure untyped-interop noise with no clean fix.
disable_error_code = [
  "no-any-return",
  "no-untyped-call",
]

# A @triton.jit body is not Python mypy can read: the decorator is untyped, and
# annotating the kernel's parameters changes how Triton's tracer treats them.
[[tool.mypy.overrides]]
module = "qpet._esp_kernel"
ignore_errors = true

# Vendored petfast inference code, untyped upstream; covered by
# tests/test_fast_backend.py against the metatomic backend.
[[tool.mypy.overrides]]
module = "qpet.backends.fast.*"
ignore_errors = true

# ----------------------------
# pytest
# ----------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
