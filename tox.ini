[tox]
env_list = tests, lint, format
isolated_build = true
skip_missing_interpreters = true

[testenv:tests]
description = Run the test suite
deps =
    pytest>=8.0
commands =
    pytest {posargs}

[testenv:lint]
description = Run Ruff linter and formatter (check only, no writes)
deps =
    ruff>=0.6.0
    mypy>=1.10.0
commands =
    ruff format --check src tests
    ruff check src tests
    mypy src

[testenv:format]
description = Run Ruff formatter (write changes)
deps =
    ruff>=0.6.0
commands =
    ruff format src tests
    ruff check --fix-only src tests
